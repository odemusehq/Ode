schema_version: "1.1"
name: verse-two-options-locked-line
expected_outcome: |
  Ode keeps the locked fourth line of verse 2 ("And the kettle still clicks off for two") exactly as
  written and offers two or three options for lines 1 to 3, without rewriting verse 1 or the rest of
  the song. The options show rather than tell, using concrete objects and domestic detail as the
  musician asked, and drop the clichés ("more than words could ever say", "since you went away").
  They are written to match verse 1's syllable counts and stress patterns line by line, and they
  keep verse 1's ABCB rhyme scheme so that line 2 rhymes with the locked "two". Ode may note,
  without changing it, that the locked line is a syllable shorter than verse 1's last line and how
  the melody could absorb that. If three options are given, one is labelled as outside the
  musician's usual style. It keeps the musician's plain, conversational voice and UK spelling,
  explains each choice briefly, and gives syllable counts and rhyme types as checked results only if
  a check actually ran; otherwise it marks them as unchecked.
