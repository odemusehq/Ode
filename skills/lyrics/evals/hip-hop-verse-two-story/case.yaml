schema_version: "1.1"
name: hip-hop-verse-two-story
expected_outcome: |
  Ode writes exactly 8 numbered bars for verse 2 (one full draft, possibly with alternatives for
  some bars, or two or three complete 8-bar versions) that continue the story from verse 1: the
  musician now working overnight warehouse shifts to pay for studio time and realising they have
  become their mom. The bars use concrete details from that world (the shift, the warehouse,
  sleeping through the day, dinner at 6am) and echo images from verse 1 to land the realisation,
  ideally with a turn or payoff near the end. They match the musician's voice and density from verse
  1: laid-back, conversational, with internal rhymes but no showy wordplay. Ode does not invent
  biographical claims beyond what the musician gave (no crime, drugs, money or family facts they
  didn't mention), does not borrow other artists' lines, flows or ad-libs, uses US spelling ("mom"),
  marks the main rhymes and any breath or delivery notes, and does not present syllable counts or
  rhyme types as checked unless a check actually ran.
