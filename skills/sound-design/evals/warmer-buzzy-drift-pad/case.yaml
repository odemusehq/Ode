schema_version: "1.1"
name: warmer-buzzy-drift-pad
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Mode: Auto (the default). A D minor song at 92 BPM: Verse (beats 0–32) and Chorus (beats 32–64).
  The Pad track plays chords in the chorus on a Drift that sounds thin and buzzy: two saws, Filter
  Freq 18000 Hz, Filter Res 0.45, Env 1 Attack 2 ms, Env 1 Release 300 ms, no effects after it. Its
  chords sit in the same octave as the Lead Vox (audio) in the chorus. The musician selected the Pad's
  chorus clip and clicked "Warmer".

  Ode changes the existing Drift in place, as one undo step: Filter Freq comes down to roughly
  1.5–5 kHz with Filter Res no higher than 0.45, and it may soften the source (oscillator 2 from Saw to
  Triangle, less detune), lengthen the attack a little, or add gentle saturation after the Drift on
  the same track. When the lower cutoff makes the pad quieter, it raises the Drift's Volume so the
  level stays matched. No track, clip or take is created, the Drift is neither duplicated nor
  replaced, and the Drums, Bass and Lead Vox stay as they were.

  After the change Ode checks the pad's level in the chorus (beats 32–64), on its track meter or on the
  Master, with no clipping and the level about where it was, and checks the pad against the Lead Vox in
  the chorus by register or by a measurement, without calling masking measured when nothing measured
  it (the pad is MIDI). It doesn't start playback for listening and doesn't ask the musician to listen.
  Ode asks no question and replies in one line, for example: "Pad warmer: filter 18 kHz → 2.6 kHz, osc
  2 to triangle, volume +2 dB · level matched, no clipping, top end thinned under the vocal."
