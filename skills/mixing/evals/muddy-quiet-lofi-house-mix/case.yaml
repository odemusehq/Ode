schema_version: "1.1"
name: muddy-quiet-lofi-house-mix
expected_outcome: |
  Ode explains the likely causes in plain words: a low-mid build-up (around 200-500 Hz) from the unfiltered reverb return and from the pad and Rhodes, possible overlap between kick and bass, and a few loud peaks (likely kick or bass) reaching -0.1 dB while the average stays low. It proposes concrete fixes with values: high-pass the reverb return (around 200-500 Hz) and low-pass it (around 6-10 kHz), lower the sends, and use Hybrid Reverb's Bass Mono; cut 2-3 dB around 250-400 Hz on the pad and Rhodes; high-pass the crackle loop; sort out kick and bass (who owns the sub, sidechain, tuning, complementary EQ, mono low end). It gain-stages so the Master peaks around -6 to -3 dBFS with no limiter while mixing, and explains that loudness comes in mastering while the mix decides how loud the master can get. It plans measurements before and after (track meters, masking between kick and bass, the Master spectrum), makes one change at a time with matched-loudness comparisons, and asks for approval before changing the Set.
