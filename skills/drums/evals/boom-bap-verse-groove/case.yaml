schema_version: "1.1"
name: boom-bap-verse-groove
expected_outcome: |
  Ode writes a 4-bar boom bap groove at 90 BPM as a step grid or a clear per-drum note list: snare (or
  clap) on beats 2 and 4, a syncopated kick that includes beat 1 and the "and" of 2 so it locks with
  the bassline, hi-hats in eighths or swung sixteenths with accents, and a few low-velocity ghost
  notes. It suggests swing of roughly 55-62%, applied more to hats and ghost notes than to kick and
  snare, gives velocity values or ranges (accents, normal hits, ghosts), varies the pattern slightly
  across the four bars, and puts a short fill at the end of bar 4 that lands on the hook's downbeat
  without crowding the rapper. It maps the parts to Drum Rack pads or General MIDI notes (kick 36,
  snare 38 and so on) or names the pads clearly, explains its choices briefly in musical terms, and
  places new parts in a new clip rather than overwriting existing drums. If it offers three grooves,
  one is clearly labelled as outside the musician's usual style.
