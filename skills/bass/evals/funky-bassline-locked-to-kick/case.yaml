schema_version: "1.1"
name: funky-bassline-locked-to-kick
expected_outcome: |
  Ode gives two or three bassline options as note names with rhythm. Each plays the chord's root (F,
  E, D, G) on beat 1 and lines notes up with the kick on 1, the "a" of 1 and 3; uses chord tones,
  octaves or fifths for movement and passing or chromatic approach notes on weak beats to connect the
  chords; leaves rests, especially around the snare on 2 and 4, so the busy vocal has room; and stays
  in a sensible bass register (roughly E1 to C3). Each option has a one- or two-sentence explanation
  in musical terms (for example roots locked to the kick, melodic with passing tones, syncopated
  octaves). If three options are given, one is clearly labelled as outside the musician's usual style.
  It does not present the line as checked against the chords or the kick unless a check actually ran,
  and it does not change the drums or chords.
