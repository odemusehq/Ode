schema_version: "1.1"
name: trap-808-line-with-slides
expected_outcome: |
  Ode writes an 808 line as note names with lengths or positions, tuned to F♯ minor and mostly
  following the chord roots (F♯, D, A, E), or deliberately staying on the root with the resulting
  tension named. It leaves room around the clap on beat 3, includes a few slides (overlapping notes
  with glide or portamento in mono, for example up an octave or to the fifth) used sparingly, and
  explains note length as the 808's tail: shorter notes in busy passages, longer notes that ring
  before rests, and no tail running into the next hit. It keeps the notes in a range that carries
  (roughly E1 to E2, for example F♯1 at about 46 Hz), and mentions harmonics or saturation for small
  speakers if relevant. It explains its choices briefly in musical terms and, if it offers three
  lines, labels one as outside the musician's usual style.
