schema_version: "1.1"
name: dynamic-folk-streaming-master
expected_outcome: |
  Ode measures the mix first (integrated loudness, short-term loudness of the loudest section, true peak, spectrum) and again after each stage, comparing at matched loudness. It builds a modest chain in a sensible order with values and reasons: EQ Eight with a gentle low cut around 20-30 Hz only if needed and small broad moves, Glue Compressor at ratio 2 with a slowish attack and about 1-2 dB of gain reduction, optional subtle saturation, and the Limiter last with a ceiling around -1 dBTP (true peak mode where available). It explains loudness normalisation with typical values stated as typical (Spotify around -14 LUFS, Apple Music around -16 LUFS), says the music decides, and suggests a target around -14 to -16 LUFS for this dynamic material rather than pushing it loud; it notes that one master can serve all three services and that services without normalisation play the file as it is. It keeps the limiter's gain reduction small and checks translation. It gives export guidance (WAV, 24-bit at the project's sample rate, normalisation off, dither only when reducing bit depth) and measures the exported file. It works in small, approved steps.
