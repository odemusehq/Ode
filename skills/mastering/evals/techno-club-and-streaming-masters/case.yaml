schema_version: "1.1"
name: techno-club-and-streaming-masters
expected_outcome: |
  Ode diagnoses that a true peak above 0 dBTP together with a crackling kick points to an over-driven limiter (and possibly a ceiling or true peak setting that doesn't catch peaks between samples), and proposes reducing limiter gain, optionally shaving peaks with a clipper or gentle saturation before the limiter, and checking the low end. For the club master it aims for a louder but clean result with the ceiling below 0 dBTP (for example -1 dBTP) and loudness wherever the kick stays clean, mentioning dense dance masters often land around -9 to -7 LUFS as a typical value, not a requirement. For the streaming master it uses less limiting, explains that platforms normalise to around -14 LUFS so louder masters are turned down, and uses a ceiling of around -1 to -2 dBTP. It measures before and after each change and measures both exported files, compares at matched loudness, gives export formats and clear file names (WAV 24-bit at the project rate; 16-bit with dither only if asked), and works in small steps the musician approves.
