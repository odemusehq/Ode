schema_version: "1.1"
name: master-for-streaming
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Mode: Auto (the default). A finished B♭ major pop mix at 104 BPM, 52 bars (beats 0–208, about two
  minutes): Drums, Bass and Keys (MIDI), Lead Vox and BV (audio), a reverb and a delay return, and
  locators from Intro to Outro with three choruses. The Main track's device chain is empty. The
  musician selected the Main track and clicked "Master for streaming".

  Ode reads the Main track, the streaming target (around −14 LUFS integrated with a −1 dBTP ceiling)
  and the sections, then builds the chain in place on the Main track, as one undo step, with the
  Limiter last: typically EQ Eight (a gentle low cut around 20–30 Hz, small tonal moves of 0.5–1.5 dB),
  Glue Compressor (ratio 2, attack 10 or 30 ms, auto release, threshold set for about 1–2 dB of gain
  reduction on the loud parts) and a Limiter with a −1 dB ceiling, true-peak limiting on where it
  offers it, and its gain raised toward the target as far as the music allows. Every other track
  stays as it was, and there is one chain with one limiter.

  Ode checks the chain's order and settings against the target. Its measurements hear the tracks
  before their devices, so every loudness or true-peak figure in the reply is the target or a setting
  Ode made. Ode decides by itself and replies in one line, for example: "Mastered for streaming: EQ
  Eight low cut at 25 Hz, Glue at ratio 2, Limiter ceiling −1 dB with true peak on · aimed at −14
  LUFS, one limiter, last; play chorus 3 to hear it."
