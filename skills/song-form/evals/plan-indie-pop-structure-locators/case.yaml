schema_version: "1.1"
name: plan-indie-pop-structure-locators
expected_outcome: |
  Ode proposes two or three complete forms as tables with established section names (Intro, Verse,
  Pre-Chorus, Chorus, Post-Chorus, Bridge, Outro and so on), bar lengths, start bars and start times
  computed correctly for 112 BPM in 4/4 (one bar is about 2.14 seconds), with each total under 3:30
  and the time to the first chorus stated. It deals with the long 16-bar verse (for example a short
  intro, a halved second verse, or starting with the riff or the chorus) so the first chorus is not
  late, uses the 4-bar riff in a sensible place (intro, between sections or outro), keeps sections in
  whole phrases, shows contrast between sections and a lift into the final chorus, and gives an energy
  level or a note on what changes per section. If three forms are offered, one is clearly labelled as
  outside the musician's usual style. It describes the locators it will place (one on the first
  downbeat of each section, named like "Verse 1" and "Chorus 1") and waits for approval before placing
  them, without moving or renaming existing locators. It uses no invented terms.
