schema_version: "1.1"
name: chorus-harmonies-doubles-responses
expected_outcome: |
  Ode writes a harmony line as note names with rhythm, mostly a diatonic third (or sixth) from the
  lead on the same words and rhythm, but adjusts or flags notes where the parallel line would clash
  with the chord on a strong or long note (for example the F♯4 a third above D4 over the C chord in
  bar 3), using a chord tone or a held note instead and keeping the harmony line singable. Every part
  stays inside D3-A4. It says which lines to double (such as the hook or title lines, possibly an
  octave double where it fits the range) and writes short call-and-response answers for the final
  chorus placed in the gaps of the lead (around the held notes in bars 2 and 4) without covering the
  lead's key words. The lead stays unchanged and each backing part goes in its own clearly named clip.
  Choices are explained briefly in musical terms; range and chord fit are reported as checked only if
  a check actually ran. If three arrangements are offered, one is clearly labelled as outside the
  musician's usual style.
