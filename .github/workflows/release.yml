# Publishes a GitHub release when a version tag is pushed. `npm version 0.2.0` makes the tag: it runs the typecheck
# and the tests, writes the version, commits "Release 0.2.0", tags v0.2.0 and pushes both.
#
# The Live extension is built with the Ableton Extensions SDK, kept in a private Cloudflare R2 bucket. The job
# downloads it into vendor/ with a read-only key for that bucket, set in the repository's Actions settings: the
# secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY, and the variables R2_ACCOUNT_ID and R2_BUCKET.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download the Extensions SDK packages into vendor/, where package.json expects them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::Add R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY as secrets, and R2_ACCOUNT_ID and R2_BUCKET as variables, in the repository's Actions settings"
            exit 1
          fi
          aws s3 sync "s3://$R2_BUCKET" vendor --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress

      - run: npm ci
      - name: Verify the SDK runtime architecture
        env:
          TARGET: ${{ matrix.target }}
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "$TARGET"
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:package -- "$GITHUB_REF_NAME"
      - name: Name the platform package
        env:
          TARGET: ${{ matrix.target }}
        run: mv "release/Ode-${GITHUB_REF_NAME#v}.ablx" "release/Ode-${GITHUB_REF_NAME#v}-$TARGET.ablx"
      - run: npm run --silent release:notes > release/notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ode-release-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ode-release-*
          path: release
          merge-multiple: true
      - name: Verify all platform packages are present
        run: |
          for target in darwin-arm64 darwin-x64 win32-x64; do
            test -f "release/Ode-${GITHUB_REF_NAME#v}-$target.ablx"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/*.ablx release/*.amxd --verify-tag --title "Ode ${GITHUB_REF_NAME#v}" --notes-file release/notes.md
